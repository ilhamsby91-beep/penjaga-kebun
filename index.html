<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penjaga Kebun Nusantara</title>
  <meta name="description" content="Penjaga Kebun Nusantara: game bertani sambil belajar sejarah Indonesia, plus Matematika, Bahasa Indonesia, Bahasa Inggris, Pancasila, KIK, dan RPL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <button type="button" class="logo" id="btn-home">
      <span class="logo-mark" aria-hidden="true">🌾</span>
      <span class="logo-text" data-t="gameName"></span>
    </button>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="btn-sound"></button>
    </div>
  </header>

  <!-- ===== LAYAR JUDUL ===== -->
  <main id="scr-title" class="screen">
    <section class="hero">
      <div class="hero-text">
        <p class="pill" data-t="tag"></p>
        <h1 data-t="gameName"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="subjects" id="subjects-title"></div>
        <h2 class="h-small" data-t="chooseDiff"></h2>
        <div class="diffs" id="diffs" role="radiogroup"></div>
        <p class="best" id="best"></p>
        <button type="button" class="btn btn-main btn-lg" id="btn-play" data-t="play"></button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="era-strip" id="era-strip"></div>
        <div class="mini-farm">
          <span>🌾</span><span>🌱</span><span>🌽</span>
          <span>🌿</span><span>☕</span><span>🌶️</span>
          <span>🐛</span><span>🎋</span><span>🌱</span>
        </div>
      </div>
    </section>
    <section class="howto">
      <h2 data-t="howTitle"></h2>
      <ol class="how-steps">
        <li><b>1</b><span data-t="how1"></span></li>
        <li><b>2</b><span data-t="how2"></span></li>
        <li><b>3</b><span data-t="how3"></span></li>
        <li><b>4</b><span data-t="how4"></span></li>
      </ol>
    </section>
  </main>

  <!-- ===== KEBUN ===== -->
  <main id="scr-game" class="screen" hidden>
    <div class="hud-wrap">
      <div class="hud">
        <div class="hud-item hud-day">
          <span class="lbl" id="hud-daylbl"></span>
          <strong id="hud-era"></strong>
          <div class="daybar" aria-hidden="true"><div id="daybar"></div></div>
        </div>
        <div class="hud-item"><span class="lbl" data-t="weather"></span><strong id="hud-weather"></strong></div>
        <div class="hud-item"><span class="lbl" data-t="coins"></span><strong id="hud-coins"></strong></div>
        <div class="hud-item"><span class="lbl" data-t="target"></span><strong id="hud-target"></strong></div>
      </div>
      <p class="toast" id="toast" aria-live="polite"></p>
    </div>

    <div class="layout">
      <section class="panel farm-panel" aria-labelledby="farm-h">
        <div class="panel-head">
          <h2 id="farm-h" data-t="farm"></h2>
          <span class="hint" data-t="farmHint"></span>
        </div>
        <div class="farm" id="farm"></div>
        <div class="legend" id="legend"></div>
        <div class="seeds-wrap">
          <h3 data-t="seeds"></h3>
          <div class="seeds" id="seeds"></div>
        </div>
      </section>

      <div class="side">
        <section class="panel archive-panel" aria-labelledby="arch-h">
          <div class="panel-head">
            <h2 id="arch-h" data-t="archive"></h2>
            <span class="count" id="arch-count"></span>
          </div>
          <div class="archive" id="archive"></div>
        </section>

        <section class="panel" aria-labelledby="market-h">
          <h2 id="market-h" data-t="market"></h2>
          <div class="market" id="market"></div>
        </section>

        <section class="panel" aria-labelledby="subj-h">
          <h2 id="subj-h" data-t="subjectsTitle"></h2>
          <div class="subj-score" id="subj-score"></div>
          <button type="button" class="btn btn-block" id="btn-challenge" data-t="askChallenge"></button>
        </section>
      </div>
    </div>
  </main>

  <!-- ===== HASIL ===== -->
  <main id="scr-result" class="screen" hidden>
    <div class="result-card">
      <p class="pill" id="res-diff"></p>
      <h1 id="res-title"></h1>
      <div class="stars" id="res-stars"></div>
      <p class="lead" id="res-msg"></p>
      <div class="res-grid">
        <div><span data-t="coins"></span><strong id="res-coins"></strong></div>
        <div><span data-t="target"></span><strong id="res-target"></strong></div>
        <div><span data-t="harvested"></span><strong id="res-harvest"></strong></div>
        <div><span data-t="archive"></span><strong id="res-archive"></strong></div>
      </div>
      <h2 class="h-small" data-t="subjectsTitle"></h2>
      <div class="subj-score" id="res-subj"></div>
      <div class="res-buttons">
        <button type="button" class="btn btn-main" id="res-again" data-t="playAgain"></button>
        <button type="button" class="btn" id="res-menu" data-t="menu"></button>
      </div>
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-h">
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="game.js"></script>
</body>
</html>
